name: nok_ai
description: NOK Arabic and English AI companion
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  camera: ^0.12.1
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
dev_dependencies:
  camera_platform_interface: ^2.14.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/nok-robot.png
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
